[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dockter-agent"
version = "1.0.0"
description = "Secure FastAPI local companion agent for DockTer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0"
]

[project.scripts]
dockter-agent = "dockter_agent.cli:main"
